name: Consumer examples
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Build candidate and final application images
        run: |
          entry=$(jq -ce '.[] | select(.python_version == "3.11")' versions.json)
          python_image=$(jq -r '"python:\(.patch)-slim-\(.debian_version)@\(.python_digest)"' <<< "$entry")
          debian_image=$(jq -r '"debian:\(.debian_version)-slim@\(.debian_digest)"' <<< "$entry")
          docker build --build-arg PYTHON_VERSION=3.11 --build-arg PYTHON_IMAGE="$python_image" \
            --build-arg DEBIAN_IMAGE="$debian_image" -t builder:candidate .
          for example in fastapi poetry-cli data-science; do
            docker build --build-arg BUILDER_IMAGE=builder:candidate -t "example:$example" "examples/$example"
          done
      - name: Test packaged applications
        run: |
          set -euo pipefail
          for example in fastapi poetry-cli data-science; do
            docker run --rm --entrypoint /.venv/bin/python "example:$example" -c 'import ssl, sqlite3, sys; assert sys.version_info[:2] == (3, 11) and sys.prefix == "/.venv"'
          done
          test "$(docker run --rm example:poetry-cli greet Ada)" = 'Hello, Ada!'
          docker run --rm example:data-science > report.txt
          grep -Fx 'Loaded 15 rows and 6 columns' report.txt
          grep -Fx '    Mean: 3137.78' report.txt
          cid=$(docker run -d -p 127.0.0.1:18000:8000 example:fastapi)
          trap 'docker logs "$cid"; docker rm -f "$cid"' EXIT
          curl --fail --silent --show-error --max-time 2 --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:18000/health | jq -e '.status == "healthy"'
