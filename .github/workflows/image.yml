name: Build, test and promote one Python minor
on:
  workflow_call:
    inputs:
      python_version:
        required: true
        type: string
      patch:
        required: true
        type: string
      debian_version:
        required: true
        type: string
      python_digest:
        required: true
        type: string
      debian_digest:
        required: true
        type: string
      latest:
        required: true
        type: boolean
      promote:
        required: true
        type: boolean

jobs:
  image:
    name: Build and test images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      registry:
        image: registry:2
        ports: ['5000:5000']
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      MINOR: ${{ inputs.python_version }}
      PATCH: ${{ inputs.patch }}
      PYTHON_IMAGE: python:${{ inputs.patch }}-slim-${{ inputs.debian_version }}@${{ inputs.python_digest }}
      DEBIAN_IMAGE: debian:${{ inputs.debian_version }}-slim@${{ inputs.debian_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
      - name: Build the candidate index
        run: |
          docker buildx build --pull --platform linux/amd64,linux/arm64 \
            --build-arg PYTHON_VERSION="$MINOR" --build-arg PYTHON_IMAGE="$PYTHON_IMAGE" \
            --build-arg DEBIAN_IMAGE="$DEBIAN_IMAGE" --sbom=true --provenance=true \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation 'index:org.opencontainers.image.description=Build your Python distroless containers with this' \
            --cache-from "type=gha,scope=python-$MINOR" --cache-to "type=gha,mode=max,scope=python-$MINOR" \
            --metadata-file build.json --push -t localhost:5000/builder:candidate .
          digest=$(jq -er '."containerimage.digest"' build.json)
          echo "DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Test the builder and distroless runtime on both platforms
        run: |
          curl -fsS -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "http://localhost:5000/v2/builder/manifests/$DIGEST" > index.json
          for arch in amd64 arm64; do
            child=$(jq -er --arg arch "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' index.json)
            platform_image="localhost:5000/builder@$child"
            docker run --rm --platform "linux/$arch" "$platform_image" sh -ec 'for tool in uv pip poetry pipenv pdm; do "$tool" --version; done'
            docker run --rm -i --platform "linux/$arch" "$platform_image" /.venv/bin/python - <<'PYTHON'
          from importlib.metadata import distributions
          import sys

          assert sys.prefix == "/.venv"
          installed = {d.metadata["Name"].lower() for d in distributions()}
          assert "pip" in installed
          assert installed.isdisjoint({"poetry", "pipenv", "pdm"}), installed
          PYTHON
            docker run --rm --platform "linux/$arch" "$platform_image" sh -ec '
              uv pip install requests
              /.venv/bin/pip install click
              /.venv/bin/python -c "import click, requests"
            '
            docker buildx build --platform "linux/$arch" --build-arg SOURCE="$platform_image" --load -t "runtime:$arch" - <<'DOCKERFILE'
          ARG SOURCE
          FROM ${SOURCE} AS builder
          RUN uv pip install 'click==8.1.8'
          FROM gcr.io/distroless/python3-debian12
          COPY --from=builder /usr/local /usr/local
          COPY --from=builder /.venv /.venv
          ENTRYPOINT ["/.venv/bin/python"]
          DOCKERFILE
            docker run --rm --platform "linux/$arch" -e PATCH "runtime:$arch" -c 'import click, os, platform, sqlite3, ssl, sys; assert platform.python_version() == os.environ["PATCH"] and sys.prefix == "/.venv"'
          done

      - name: Record the tested digest and source tree
        run: |
          jq -n --arg minor "$MINOR" --arg patch "$PATCH" --arg digest "$DIGEST" \
            --arg commit "$GITHUB_SHA" --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --argjson platforms '["linux/amd64","linux/arm64"]' \
            '{minor: $minor, patch: $patch, digest: $digest, commit: $commit, tree: $tree, platforms: $platforms}' \
            > tested-image.json
      - uses: actions/upload-artifact@v7
        with:
          name: tested-python-${{ inputs.python_version }}-${{ github.run_attempt }}
          path: tested-image.json
          if-no-files-found: error

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Upload the tested index to GHCR
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update && sudo apt-get install -y skopeo
          fi
          skopeo copy --all --preserve-digests --src-tls-verify=false \
            --dest-authfile "$HOME/.docker/config.json" \
            "docker://localhost:5000/builder@$DIGEST" "docker://$IMAGE:$MINOR-$GITHUB_SHA"
          published=$(skopeo inspect --raw "docker://$IMAGE:$MINOR-$GITHUB_SHA" | sha256sum | cut -d' ' -f1)
          test "sha256:$published" = "$DIGEST"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            docker buildx imagetools create -t "$IMAGE:pr-${{ github.event.number }}-$MINOR" "$IMAGE@$DIGEST"
          fi

      - name: Promote the tested digest
        if: inputs.promote
        env:
          IS_LATEST: ${{ inputs.latest }}
        run: |
          tags=("$IMAGE:$MINOR")
          if [[ "$IS_LATEST" == true ]]; then
            tags+=("$IMAGE:latest")
          fi
          args=()
          for tag in "${tags[@]}"; do
            args+=(-t "$tag")
          done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          printf '{"auths":{}}' > anonymous.json
          for tag in "${tags[@]}"; do
            published=$(skopeo inspect --authfile anonymous.json --raw "docker://$tag" | sha256sum | cut -d' ' -f1)
            test "sha256:$published" = "$DIGEST"
          done
