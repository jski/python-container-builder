name: Check Python Versions
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - id: refresh
        continue-on-error: true
        run: node scripts/versions.mjs --refresh
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          branch: update-builder-digests
          add-paths: versions.json
          delete-branch: true
          title: Refresh builder base image digests
          commit-message: Refresh builder base image digests
          body: Refresh the Python and Debian image inputs used by the build matrix.
          labels: dependencies
      - name: Report unresolved upstream inputs
        if: steps.refresh.outcome == 'failure'
        run: exit 1
