name: Build & Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promote to production tags after build'
        required: false
        type: boolean
        default: false

concurrency:
  group: image-release-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: false

jobs:
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - run: node --test scripts/versions.test.mjs
      - id: versions
        run: |
          matrix=$(node scripts/versions.mjs)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  image:
    name: Python ${{ matrix.python_version }}
    needs: versions
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      python_version: ${{ matrix.python_version }}
      patch: ${{ matrix.patch }}
      debian_version: ${{ matrix.debian_version }}
      python_digest: ${{ matrix.python_digest }}
      debian_digest: ${{ matrix.debian_digest }}
      latest: ${{ matrix.latest }}
      promote: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'push' && !github.event.forced) || (github.event_name == 'workflow_dispatch' && inputs.promote)) }}
